<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ea"><title>Martin & Matilda — Fotochallenge</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section id="welcomeView" class="view welcome-view is-active"><div class="topline"><span>08.08.2026</span><span>Köln</span></div><div class="welcome-copy"><p class="eyebrow">Martin & Matilda</p><h1>Foto<br>challenge</h1><p class="intro">Haltet diesen Tag aus eurer Perspektive fest.</p></div><div class="start-actions"><button id="enterButton" class="primary-button"><span>Challenge starten</span><span>→</span></button><button id="freeUploadButton" class="secondary-button"><span>Foto ohne Challenge hochladen</span><span>↗</span></button></div></section><section id="challengeView" class="view challenge-view"><div class="topline"><button id="backButton" class="quiet-button">←</button><span id="challengeCounter">01 / 25</span></div><article class="challenge-card"><p id="challengeNumber" class="challenge-number">01</p><h2 id="challengeText"></h2></article><div class="challenge-actions"><button id="shuffleButton" class="secondary-button"><span>Andere Aufgabe</span><span>↻</span></button><button id="chooseButton" class="primary-button"><span>Diese Aufgabe wählen</span><span>→</span></button></div><button id="allChallengesButton" class="list-link">Alle Aufgaben ansehen</button></section><section id="uploadView" class="view upload-view"><div class="topline"><button id="uploadBackButton" class="quiet-button">←</button><span>Upload</span></div><div class="selected-challenge"><p id="uploadChallengeNumber" class="challenge-number"></p><h2 id="uploadChallengeText"></h2></div><div class="form"><label for="guestName">Name <span>optional</span></label><input id="guestName" type="text" maxlength="60" placeholder="Euer Vorname oder eure Namen"><label for="photo">Foto</label><label for="photo" class="file-picker"><span id="fileLabel">Foto aufnehmen oder auswählen</span><span>↗</span></label><input id="photo" type="file" accept="image/*" hidden><div id="previewWrap" class="preview-wrap" hidden><img id="preview" alt="Vorschau"></div><button id="uploadButton" class="primary-button full-width"><span>Foto hochladen</span><span>→</span></button><p id="status" class="status"></p></div></section><section id="successView" class="view success-view"><div class="success-mark">✓</div><p class="eyebrow">Upload abgeschlossen</p><h2>Danke für eure Perspektive.</h2><p class="success-note">Euer Foto ist jetzt Teil der Live-Diashow.</p><button id="nextChallengeButton" class="primary-button full-width"><span>Nächste Challenge</span><span>→</span></button><button id="finishButton" class="list-link">Zur Startseite</button></section><section id="listView" class="view list-view"><div class="topline"><button id="listBackButton" class="quiet-button">←</button><span>Alle Aufgaben</span></div><div id="challengeList" class="challenge-list"></div></section></main><script src="script.js"></script></body></html>
